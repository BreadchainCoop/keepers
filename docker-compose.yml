services:
  keeper:
    build: .
    restart: unless-stopped
    # Shares a host with other services; a run peaks around 25 MB.
    mem_limit: 128m
    cpus: 0.25
    environment:
      # near-hackathon branch: only the NEAR job is scheduled (see crontab).
      NEAR_KEEPER_ACCOUNT_ID: ${NEAR_KEEPER_ACCOUNT_ID:?}
      NEAR_KEEPER_PUBLIC_KEY: ${NEAR_KEEPER_PUBLIC_KEY:?}
      NEAR_KEEPER_PRIVATE_KEY: ${NEAR_KEEPER_PRIVATE_KEY:-}
      SAVING_CIRCLES_NEAR_NETWORK: ${SAVING_CIRCLES_NEAR_NETWORK:-testnet}
      SAVING_CIRCLES_NEAR_CONTRACT: ${SAVING_CIRCLES_NEAR_CONTRACT:-}
      SAVING_CIRCLES_NEAR_RPC_URLS: ${SAVING_CIRCLES_NEAR_RPC_URLS:-}
      SAVING_CIRCLES_NEAR_HEALTHCHECK_URL: ${SAVING_CIRCLES_NEAR_HEALTHCHECK_URL:-}
      SAVING_CIRCLES_NEAR_MIN_BALANCE: ${SAVING_CIRCLES_NEAR_MIN_BALANCE:-}
      SAVING_CIRCLES_NEAR_MIN_ALLOWANCE: ${SAVING_CIRCLES_NEAR_MIN_ALLOWANCE:-}
      SAVING_CIRCLES_NEAR_PAGE_SIZE: ${SAVING_CIRCLES_NEAR_PAGE_SIZE:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DRY_RUN: ${DRY_RUN:-}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

services:
  keeper:
    build: .
    restart: unless-stopped
    # Shares a host with other services; a run peaks around 25 MB.
    mem_limit: 128m
    cpus: 0.25
    environment:
      KEEPER_PRIVATE_KEY: ${KEEPER_PRIVATE_KEY:?}
      RPC_URLS: ${RPC_URLS:-https://rpc.gnosischain.com,https://gnosis-rpc.publicnode.com}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
      MIN_BALANCE_XDAI: ${MIN_BALANCE_XDAI:-0.2}
      DRY_RUN: ${DRY_RUN:-}
      SAVING_CIRCLES_EXECUTOR_PRIVATE_KEY: ${SAVING_CIRCLES_EXECUTOR_PRIVATE_KEY:-}
      SAVING_CIRCLES_GNOSIS_RPC_URLS: ${SAVING_CIRCLES_GNOSIS_RPC_URLS:-}
      SAVING_CIRCLES_CELO_RPC_URLS: ${SAVING_CIRCLES_CELO_RPC_URLS:-}
      SAVING_CIRCLES_GNOSIS_HEALTHCHECK_URL: ${SAVING_CIRCLES_GNOSIS_HEALTHCHECK_URL:-}
      SAVING_CIRCLES_CELO_HEALTHCHECK_URL: ${SAVING_CIRCLES_CELO_HEALTHCHECK_URL:-}
      SAVING_CIRCLES_GNOSIS_ADDRESS: ${SAVING_CIRCLES_GNOSIS_ADDRESS:-}
      SAVING_CIRCLES_CELO_ADDRESS: ${SAVING_CIRCLES_CELO_ADDRESS:-}
      SAVING_CIRCLES_GNOSIS_MIN_BALANCE: ${SAVING_CIRCLES_GNOSIS_MIN_BALANCE:-}
      SAVING_CIRCLES_CELO_MIN_BALANCE: ${SAVING_CIRCLES_CELO_MIN_BALANCE:-}
      SAVING_CIRCLES_GAS_LIMIT_MULTIPLIER_PCT: ${SAVING_CIRCLES_GAS_LIMIT_MULTIPLIER_PCT:-}
      SAVING_CIRCLES_MAX_GAS_LIMIT: ${SAVING_CIRCLES_MAX_GAS_LIMIT:-}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
